<script>
/* ==========================================================================
   JsReports — รายงานแบบทางการ พิมพ์และบันทึกเป็น PDF ได้ (ระยะที่ 7, ข้อกำหนดข้อ 11)
   - ตัวเลขทุกตัวมาจาก Server (Reports.gs, Closings.gs, Arrears.gs, Receipts.gs) หน้านี้จัดรูปแบบเท่านั้น
   - เอกสารแสดงเป็นแผ่น A4 บนจอ และพิมพ์เฉพาะเนื้อเอกสาร (ปุ่ม เมนู ตัวกรองไม่ถูกพิมพ์)
   - บันทึกเป็น PDF: กดปุ่ม "พิมพ์ / บันทึก PDF" แล้วเลือกปลายทาง "บันทึกเป็น PDF" ในหน้าต่างพิมพ์ของเบราว์เซอร์
   - ทุกเอกสารพิมพ์วันเวลาที่ออกรายงาน ผู้ออกรายงาน และช่องลงนาม
   ========================================================================== */
(function () {
  'use strict';
  var h = App.h;
  var clear = App.clear;
  var button = App.button;
  var amt = function (s) { return formatSatang_(s); };
  var thaiDate = function (iso) { return iso ? formatThaiDate_(iso) : '–'; };
  var DOTS = '.........................................';

  // ==========================================================================
  // ส่วนประกอบของเอกสาร
  // ==========================================================================
  function docHead(meta, title, sub, extra) {
    return h('div', { class: 'doc-head' },
      h('div', { class: 'doc-school', text: meta.school.name }),
      meta.school.affiliation ? h('div', { class: 'small', text: meta.school.affiliation }) : null,
      h('div', { class: 'doc-title', text: title }),
      sub ? h('div', { class: 'doc-sub', text: sub }) : null,
      extra || null);
  }

  function docFoot(meta, left) {
    return h('div', { class: 'doc-foot' },
      h('span', { text: left || '' }),
      h('span', { text: 'ออกรายงานเมื่อ ' + formatThaiDateTime_(meta.generatedAt) + ' โดย ' + meta.generatedBy }));
  }

  function signs(list) {
    return h('div', { class: 'doc-signs' }, list.map(function (s) {
      return h('div', { class: 'doc-sign' },
        h('div', { text: 'ลงชื่อ ' + DOTS + ' ' + s[0] }),
        h('div', { text: '(' + (s[1] || DOTS) + ')' }),
        h('div', { text: 'ตำแหน่ง ' + (s[2] || '..............................') }),
        h('div', { text: 'วันที่ ........ / ........ / ........' }));
    }));
  }

  function preparerAndDirector(meta) {
    var s = meta.signers;
    return signs([['ผู้จัดทำ', s.financeName, s.financePosition], ['ผู้ตรวจสอบ', '', ''], ['ผู้อำนวยการ', s.directorName, s.directorPosition]]);
  }

  /**
   * ตารางในเอกสาร (ไม่แปลงเป็นการ์ดบนมือถือ เลื่อนซ้ายขวาได้แทน)
   * columns: [{ label, className, render(row, index) }] / rows: [{ ..., _class }] / foot: [{ className, cells: [{ text, colspan, className }] }]
   */
  function docTable(columns, rows, foot, emptyText) {
    var thead = h('thead', null, h('tr', null, columns.map(function (c) { return h('th', { class: c.headClass || c.className, text: c.label }); })));
    var tbody = h('tbody');
    if (!rows.length) {
      tbody.appendChild(h('tr', null, h('td', { class: 'center', colspan: String(columns.length), text: emptyText || 'ไม่มีรายการ' })));
    }
    rows.forEach(function (row, i) {
      var tr = h('tr', { class: row._class || null });
      columns.forEach(function (c) {
        var v = c.render ? c.render(row, i) : row[c.key];
        var td = h('td', { class: c.className || null });
        if (v instanceof Node) td.appendChild(v);
        else if (Array.isArray(v)) v.forEach(function (x) { if (x) td.appendChild(x instanceof Node ? x : document.createTextNode(String(x))); });
        else td.textContent = v === null || v === undefined || v === '' ? '–' : String(v);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    var tfoot = foot && foot.length ? h('tfoot', null, foot.map(function (f) {
      return h('tr', { class: f.className || 'total' }, f.cells.map(function (c) {
        return h('td', { class: c.className || null, colspan: c.colspan ? String(c.colspan) : null, text: c.text });
      }));
    })) : null;
    return h('div', { class: 'doc-scroll' }, h('table', { class: 'doc-table' }, thead, tbody, tfoot));
  }

  function line(label, value) {
    return h('div', null, h('span', { class: 'strong', text: label + ' ' }), h('span', { text: value }));
  }

  /** หน้าโครงรายงาน: หัวหน้า (ไม่พิมพ์) ตัวกรอง (ไม่พิมพ์) และเอกสาร */
  function reportPage(title, desc, filters, body, extraActions) {
    var actions = [button('กลับหน้ารายงาน', 'ghost', function () { App.go('reports'); }, 'arrowLeft')]
      .concat(extraActions || [])
      .concat([button('พิมพ์ / บันทึก PDF', '', function () { window.print(); }, 'printer')]);
    return h('div', { class: 'has-print-head' },
      App.pageHead(title, desc, actions),
      filters && filters.length ? h('div', { class: 'toolbar filter-bar no-print' }, filters) : null,
      body);
  }

  function showButton(onClick) {
    var b = button('แสดงรายงาน', 'secondary', onClick, 'search');
    return h('div', { class: 'field', style: { flex: '0 0 auto', minWidth: '0', justifyContent: 'flex-end' } }, b);
  }

  function yearOptions(years) {
    return years.map(function (y) { return { value: String(y.year), label: y.label + (y.isCurrent ? ' (ปัจจุบัน)' : '') }; });
  }

  // ---------------------------------------------------------------- ช่วงเวลา (D-18)
  function periodFields(params, years, today) {
    var p = params || {};
    var fyNow = fiscalYearOfDate_(today);
    var fyOptions = [];
    for (var fy = fyNow; fy >= fyNow - 5; fy--) fyOptions.push({ value: String(fy), label: 'ปีงบประมาณ ' + fy });
    var monthOptions = [];
    var parts = today.split('-').map(Number);
    for (var i = 0; i < 24; i++) {
      var y = parts[0];
      var m = parts[1] - i;
      while (m < 1) { m += 12; y -= 1; }
      var key = y + '-' + (m < 10 ? '0' : '') + m;
      monthOptions.push({ value: key, label: formatThaiMonth_(key) });
    }
    var type = App.field({ label: 'ช่วงเวลา', type: 'select', value: p.periodType || 'academic', options: [
      { value: 'academic', label: 'ปีการศึกษา' }, { value: 'fiscal', label: 'ปีงบประมาณ' },
      { value: 'month', label: 'รายเดือน' }, { value: 'range', label: 'กำหนดวันที่เอง' }] });
    var year = App.field({ label: 'ปีการศึกษา', type: 'select', options: yearOptions(years),
      value: String(p.year || App.state.me.school.currentAcademicYear) });
    var fiscal = App.field({ label: 'ปีงบประมาณ', type: 'select', options: fyOptions, value: String(p.fiscalYear || fyNow) });
    var month = App.field({ label: 'เดือน', type: 'select', options: monthOptions, value: p.month || monthOptions[0].value });
    var from = App.field({ label: 'ตั้งแต่วันที่', type: 'date', value: p.fromDate || today.slice(0, 8) + '01' });
    var to = App.field({ label: 'ถึงวันที่', type: 'date', value: p.toDate || today });
    function sync() {
      var t = type.get();
      year.wrap.classList.toggle('hidden', t !== 'academic');
      fiscal.wrap.classList.toggle('hidden', t !== 'fiscal');
      month.wrap.classList.toggle('hidden', t !== 'month');
      from.wrap.classList.toggle('hidden', t !== 'range');
      to.wrap.classList.toggle('hidden', t !== 'range');
    }
    type.input.addEventListener('change', sync);
    sync();
    return {
      wraps: [type.wrap, year.wrap, fiscal.wrap, month.wrap, from.wrap, to.wrap],
      get: function () {
        var t = type.get();
        var out = { periodType: t };
        if (t === 'academic') out.year = Number(year.get());
        if (t === 'fiscal') out.fiscalYear = Number(fiscal.get());
        if (t === 'month') out.month = month.get();
        if (t === 'range') { out.fromDate = from.get(); out.toDate = to.get(); }
        return out;
      },
    };
  }

  function periodPayload(params) {
    var p = params || {};
    return { periodType: p.periodType, year: p.year, fiscalYear: p.fiscalYear, month: p.month, fromDate: p.fromDate, toDate: p.toDate };
  }

  // ==========================================================================
  // หน้ารวมรายงาน
  // ==========================================================================
  var REPORTS = [
    { route: 'report-daily', icon: 'cash', title: 'รายงานการรับเงินประจำวัน และปิดยอด', desc: 'เรียงตามเลขที่ใบเสร็จ ยอดแยกช่องทาง ช่องลงนาม และปิดยอดประจำวัน' },
    { route: 'report-notices', icon: 'user', title: 'เอกสารแจ้งยอดเรียกเก็บเงิน', desc: 'หนังสือแจ้งผู้ปกครอง แยกคนละหน้า เลือกชั้นหรือห้องได้' },
    { route: 'report-collections', params: { groupBy: 'room' }, icon: 'list', title: 'รายงานการรับเงินแยกตามห้อง', desc: 'เลือกปีการศึกษา ปีงบประมาณ รายเดือน หรือกำหนดวันที่เอง' },
    { route: 'report-collections', params: { groupBy: 'grade' }, icon: 'list', title: 'รายงานการรับเงินแยกตามระดับชั้น', desc: 'ยอดรวมทุกกลุ่มเท่ากับเงินที่รับจริงในช่วงเวลา' },
    { route: 'report-arrears', icon: 'alertCircle', title: 'รายงานยอดค้างชำระ', desc: 'สรุปรายชั้น/ห้อง และรายชื่อนักเรียนที่ค้างชำระ' },
    { route: 'report-register', icon: 'book', title: 'รายงานทะเบียนคุมใบเสร็จ', desc: 'ทุกเลขที่ของเล่ม: ใช้แล้ว ยกเลิก และยังไม่ใช้' },
    { route: 'report-cancelled', icon: 'x', title: 'รายงานใบเสร็จยกเลิก', desc: 'ยกเลิกใบเสร็จที่รับเงินแล้ว และเลขที่ที่เขียนผิดหรือชำรุด พร้อมผลการพิจารณา' },
    { route: 'report-annual', icon: 'calendar', title: 'รายงานสรุปประจำปีการศึกษา', desc: 'การเรียกเก็บ ลดหย่อน/ยกเว้น การรับเงินรายเดือน และยอดค้าง' },
    { route: 'report-receipt-usage', icon: 'book', title: 'รายงานการใช้ใบเสร็จประจำปีงบประมาณ', desc: 'ยกมา รับเข้า ใช้ ยกเลิก และคงเหลือของแต่ละเล่ม' },
  ];

  App.defineRoute('reports', {
    title: 'รายงานและปิดยอด',
    roles: ['FINANCE', 'DIRECTOR'],
    menu: { group: 'finance', label: 'รายงานและปิดยอด', icon: 'printer', order: 60 },
    render: function () {
      return App.api('closings.list', {}).then(function (cl) {
        var items = REPORTS.map(function (r) {
          var b = h('button', { type: 'button', class: 'report-item' }, App.icon(r.icon),
            h('span', null, h('span', { class: 'ri-title', text: r.title }), h('span', { class: 'ri-desc', text: r.desc })));
          b.addEventListener('click', function () { App.go(r.route, r.params || {}); });
          return b;
        });
        return h('div', null,
          App.pageHead('รายงานและปิดยอด', 'เลือกรายงานที่ต้องการ ทุกรายงานพิมพ์หรือบันทึกเป็น PDF ได้ (ในหน้าต่างพิมพ์ เลือกปลายทาง "บันทึกเป็น PDF")'),
          cl.unclosedCount ? h('div', { class: 'alert alert-warning', style: { marginBottom: '14px' } },
            h('span', { text: 'มีวันที่รับเงินแล้วแต่ยังไม่ปิดยอด ' + cl.unclosedCount + ' วัน (30 วันล่าสุด) ' }),
            button('ดูรายการ', 'ghost btn-sm', function () { App.go('report-daily'); })) : null,
          h('div', { class: 'report-grid' }, items));
      });
    },
  });

  // ==========================================================================
  // 2. รายงานการรับเงินประจำวัน + ปิดยอด
  // ==========================================================================
  function openCloseDay(r) {
    var f = r.figures;
    App.formModal({
      title: 'ปิดยอดวันที่ ' + thaiDate(r.date),
      submitLabel: 'ปิดยอด',
      intro: h('div', null,
        h('div', { class: 'doc-lines' },
          line('ใบเสร็จที่มีผล', f.receiptCount + ' ฉบับ' + (f.receiptRange ? ' (' + f.receiptRange + ')' : '')),
          line('ยอดรวม', App.fmt.money(f.totalSatang) + ' (' + f.totalText + ')'),
          f.byChannel.length ? line('แยกตามช่องทาง', f.byChannel.map(function (c) { return c.channel + ' ' + App.fmt.money(c.satang); }).join(' · ')) : null,
          line('รหัสตรวจสอบ', f.verifyCode)),
        h('div', { class: 'alert alert-warning', text: 'ตรวจนับเงินและสำเนาใบเสร็จให้ตรงกับรายงานก่อนปิดยอด หลังปิดยอดจะบันทึกรับเงิน ขอยกเลิก หรือขอแก้ไขรายการของวันนี้ไม่ได้ ถ้าจำเป็นต้องให้ผู้อำนวยการเปิดยอดใหม่' })),
      fields: [{ key: 'confirm', type: 'checkbox', label: r.confirmText, span2: true }],
      onSubmit: function (v) {
        return App.api('closings.close', { date: r.date, expectedDigest: f.digest, confirmChecked: v.confirm });
      },
      onDone: function (res) { App.toast(res.message, 'success'); App.refresh(); },
    });
  }

  function openReopenDay(r) {
    App.formModal({
      title: 'เปิดยอดวันที่ ' + thaiDate(r.date) + ' ใหม่',
      submitLabel: 'เปิดยอดใหม่',
      submitKind: 'danger',
      intro: 'ใช้เมื่อต้องแก้ไขรายการของวันที่ปิดยอดแล้ว เช่น ลืมบันทึกใบเสร็จ หรือต้องยกเลิกใบเสร็จ ประวัติการปิดยอดครั้งนี้ยังเก็บไว้ และเจ้าหน้าที่การเงินต้องปิดยอดใหม่หลังแก้ไข',
      fields: [{ key: 'reason', type: 'textarea', label: 'เหตุผลการเปิดยอดใหม่', required: true, maxlength: 500, span2: true }],
      onSubmit: function (v) { return App.api('closings.reopen', { date: r.date, reason: v.reason }); },
      onDone: function (res) { App.toast(res.message, 'success'); App.refresh(); },
    });
  }

  function dailyDoc(r) {
    var f = r.figures;
    var c = r.closing;
    var draft = !c ? h('div', { class: 'doc-draft', text: 'ร่าง – ยังไม่ปิดยอด' }) : null;
    var columns = [
      { label: 'ที่', className: 'center', render: function (x, i) { return String(i + 1); } },
      { label: 'เล่มที่/เลขที่', className: 'nowrap', render: function (x) { return x.bookNo + '/' + x.receiptNo; } },
      { label: 'เลขประจำตัว', className: 'nowrap', render: function (x) { return x.studentNo; } },
      { label: 'ชื่อ-สกุล', render: function (x) { return x.studentName; } },
      { label: 'ชั้น', className: 'nowrap', render: function (x) { return x.classLabel; } },
      { label: 'รายการ', render: function (x) {
        if (x.status === 'VOIDED') return 'ยกเลิกใบเสร็จ: ' + (x.voidReason || '');
        return x.items.join(', ') + (x.corrected ? ' (แก้ไขรายการแล้ว)' : '');
      } },
      { label: 'ช่องทาง', headClass: 'nowrap', render: function (x) { return x.channel + (x.channelRef ? ' ' + x.channelRef : ''); } },
      { label: 'จำนวนเงิน (บาท)', className: 'num', render: function (x) { return h('span', { class: 'amt', text: amt(x.amountSatang) }); } },
    ];
    var rows = r.rows.map(function (x) { return Object.assign({ _class: x.status === 'VOIDED' ? 'void' : null }, x); });
    var foot = [{ cells: [
      { text: 'รวมใบเสร็จที่มีผล ' + f.receiptCount + ' ฉบับ' + (f.voidedCount ? ' (ยกเลิก ' + f.voidedCount + ' ฉบับ ไม่นับรวม)' : ''), colspan: 7 },
      { text: amt(f.totalSatang), className: 'num' }] }];
    var footLeft = c
      ? 'ปิดยอดเมื่อ ' + formatThaiDateTime_(c.closedAt) + ' โดย ' + c.closedBy + ' · รหัสตรวจสอบ ' + c.verifyCode + ' · อ้างอิงประวัติ ' + c.auditAnchor
      : 'ร่าง ยังไม่ปิดยอด · รหัสตรวจสอบ ณ ขณะพิมพ์ ' + f.verifyCode;
    var s = r.meta.signers;
    return h('div', { class: 'doc' },
      docHead(r.meta, 'รายงานการรับเงินประจำวัน', 'วันที่ ' + thaiDate(r.date), draft),
      docTable(columns, rows, foot, 'ไม่มีการรับเงินในวันนี้'),
      h('div', { class: 'doc-lines' },
        line('จำนวนเงินรวม (ตัวอักษร)', '(' + f.totalText + ')'),
        f.byChannel.length ? line('แยกตามช่องทาง', f.byChannel.map(function (x) { return x.channel + ' ' + amt(x.satang) + ' บาท (' + x.count + ' ฉบับ)'; }).join(' · ')) : null,
        f.receiptRange ? line('ใบเสร็จที่ใช้', f.receiptRange) : null,
        r.spoiled.length ? line('เลขที่ที่ยกเลิกก่อนบันทึกรับเงิน (เขียนผิด/ชำรุด)', r.spoiled.map(function (x) {
          return x.bookNo + '/' + x.receiptNo + ' (' + x.statusLabel + ')';
        }).join(', ')) : null,
        c && r.matches === false ? h('div', { class: 'text-danger strong', text: 'คำเตือน: รายการของวันนี้ไม่ตรงกับตอนปิดยอด (รหัสตรวจสอบปัจจุบัน ' + f.verifyCode + ') กรุณาตรวจสอบประวัติการใช้งาน' }) : null),
      signs([['ผู้รับเงิน', s.financeName, s.financePosition], ['ผู้ตรวจสอบ', '', ''], ['ผู้อำนวยการ', s.directorName, s.directorPosition]]),
      docFoot(r.meta, footLeft));
  }

  App.defineRoute('report-daily', {
    title: 'รายงานการรับเงินประจำวัน',
    roles: ['FINANCE', 'DIRECTOR'],
    render: function (params) {
      return Promise.all([App.api('reports.daily', { date: params.date || '' }), App.api('closings.list', {})]).then(function (res) {
        var r = res[0];
        var cl = res[1];
        var dateField = App.field({ label: 'วันที่รับเงิน', type: 'date', value: r.date, max: r.today });
        var c = r.closing;
        var statusBadges = [];
        if (c) statusBadges.push(App.badge('ปิดยอดแล้ว', 'success'), h('span', { class: 'muted small', text: 'เมื่อ ' + App.fmt.datetime(c.closedAt) + ' โดย ' + c.closedBy + ' · รหัสตรวจสอบ ' + c.verifyCode }));
        else statusBadges.push(App.badge(r.rows.length ? 'ยังไม่ปิดยอด' : 'ไม่มีการรับเงิน', r.rows.length ? 'warning' : 'muted'));
        if (r.history.length) statusBadges.push(App.badge('เคยเปิดยอดใหม่ ' + r.history.length + ' ครั้ง', 'muted'));
        var actions = [];
        if (r.canClose) actions.push(button('ปิดยอดวันนี้', '', function () { openCloseDay(r); }, 'check'));
        if (r.canReopen) actions.push(button('เปิดยอดใหม่', 'danger', function () { openReopenDay(r); }));
        var notes = [];
        if (!c && r.pendingCount) notes.push(h('div', { class: 'alert alert-warning', text: 'มีคำขอยกเลิกหรือแก้ไขใบเสร็จของวันนี้รอผู้อำนวยการพิจารณา ' + r.pendingCount + ' รายการ จึงยังปิดยอดไม่ได้' }));

  function nowText() {

        return reportPage('เอกสารแจ้งยอดเรียกเก็บเงิน', 'หนังสือแจ้งผู้ปกครอง ปีการศึกษา ' + r.year + ' (รวมยอดค้างจากปีก่อน)',
          [yearSel.wrap, gradeSel.wrap, roomSel.wrap, signSel.wrap, showButton(function () {
            App.go('report-notices', { year: Number(yearSel.get()), gradeLevel: gradeSel.get(), room: roomSel.get(), signer: signSel.get(), studentId: '' });
          })],
          h('div', null, info, letters.length ? letters : h('div', { class: 'empty', text: 'ไม่มีนักเรียนที่มียอดค้างตามเงื่อนไขนี้' })));
      });
    },
  });
})();
</script>
