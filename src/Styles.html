<style>
/* ==========================================================================
   Styles — โทนกรมท่า ขาว ฟ้า / รองรับคอมพิวเตอร์และมือถือ / พิมพ์ได้
   ========================================================================== */
:root {
  --navy: #1F3A5F;
  --navy-800: #19304F;
  --navy-900: #122540;
  --navy-100: #E3E9F2;
  --blue: #2E86DE;
  --blue-700: #1F6FBF;
  --blue-50: #EEF5FD;
  --bg: #F3F6FA;
  --surface: #FFFFFF;
  --text: #1B2B3F;
  --muted: #5B6B80;
  --border: #DCE3EC;
  --success: #1E7F52;
  --success-bg: #E5F4EC;
  --danger: #B73A2E;
  --danger-bg: #FBEAE8;
  --warning: #9A6412;
  --warning-bg: #FDF3E1;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 1px 2px rgba(18, 37, 64, .06), 0 6px 16px rgba(18, 37, 64, .06);
  --sidebar-w: 260px;
  --topbar-h: 60px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: 'Sarabun', 'Tahoma', 'Leelawadee UI', 'Thonburi', sans-serif;
  font-size: 16px;
  line-height: 1.55;
  color: var(--text);
  background: var(--bg);
}
h1, h2, h3 { margin: 0; line-height: 1.3; color: var(--navy-900); }
h1 { font-size: 1.45rem; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
p { margin: 0 0 .6em; }
a { color: var(--blue-700); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid rgba(46, 134, 222, .45); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.nowrap { white-space: nowrap; }
.hidden { display: none !important; }
.mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: .85em; }
.stack { display: flex; flex-direction: column; gap: 14px; }

/* ---------- โหลดหน้าแรก / แถบสถานะกำลังทำงาน ---------- */
.boot-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--muted); }
.spinner { width: 34px; height: 34px; border: 3px solid var(--navy-100); border-top-color: var(--navy); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.busy-bar { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 100; background: linear-gradient(90deg, transparent, var(--blue), transparent); background-size: 50% 100%; opacity: 0; transition: opacity .15s; }
body.is-busy .busy-bar { opacity: 1; animation: busy 1s linear infinite; }
@keyframes busy { from { background-position: -50% 0; } to { background-position: 150% 0; } }

/* ---------- ปุ่ม ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 16px; border-radius: var(--radius-sm); border: 1px solid var(--navy); background: var(--navy); color: #fff; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--navy-800); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-secondary { background: #fff; color: var(--navy); border-color: var(--border); }
.btn-secondary:hover { background: var(--blue-50); }
.btn-danger { background: var(--danger); border-color: var(--danger); }
.btn-danger:hover { background: #9C2F25; }
.btn-ghost { background: transparent; color: var(--navy); border-color: transparent; }
.btn-ghost:hover { background: var(--blue-50); }
.btn-sm { min-height: 32px; padding: 4px 10px; font-size: .875rem; font-weight: 500; }
.btn-block { width: 100%; }
.btn svg { width: 18px; height: 18px; flex-shrink: 0; }

/* ---------- ป้าย ---------- */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; background: var(--navy-100); color: var(--navy); white-space: nowrap; }
.badge-ADMIN { background: var(--navy); color: #fff; }
.badge-FINANCE { background: var(--blue-50); color: var(--blue-700); border: 1px solid #C8DFF7; }
.badge-DIRECTOR { background: var(--warning-bg); color: var(--warning); border: 1px solid #F2DDB4; }
.badge-success { background: var(--success-bg); color: var(--success); }
.badge-danger { background: var(--danger-bg); color: var(--danger); }
.badge-muted { background: #EEF1F5; color: var(--muted); }
.badge-warning { background: var(--warning-bg); color: var(--warning); }

/* ---------- ฟอร์ม ---------- */
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
.form-grid .span-2 { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label { font-weight: 600; font-size: .95rem; }
.field .req { color: var(--danger); }
.field .help { color: var(--muted); font-size: .85rem; }
.field .preview { color: var(--blue-700); font-size: .85rem; }
.input, select.input, textarea.input { width: 100%; min-height: 42px; padding: 8px 12px; border: 1px solid #C9D3DF; border-radius: var(--radius-sm); background: #fff; }
textarea.input { min-height: 84px; resize: vertical; }
.input:focus { border-color: var(--blue); outline: 3px solid rgba(46, 134, 222, .2); }
.input:disabled, .input[readonly] { background: #F2F5F9; color: var(--muted); }
.input-group { display: flex; gap: 6px; }
.input-group .input { flex: 1; }
.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.switch input { width: 20px; height: 20px; accent-color: var(--navy); }
.alert { padding: 10px 14px; border-radius: var(--radius-sm); border: 1px solid; line-height: 1.5; }
.alert-error { background: var(--danger-bg); border-color: #F2C9C4; color: #8E2A1F; }
.alert-info { background: var(--blue-50); border-color: #C8DFF7; color: var(--navy-900); }
.alert-success { background: var(--success-bg); border-color: #BFE3CF; color: #155F3D; }
.alert-warning { background: var(--warning-bg); border-color: #F2DDB4; color: #6F4A0E; }
.rules { margin: 6px 0 0; padding-left: 20px; color: var(--muted); font-size: .9rem; }

/* ---------- หน้าเข้าสู่ระบบ ---------- */
.login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: linear-gradient(160deg, var(--navy-900) 0%, var(--navy) 55%, #2A5C93 100%); }
.login-card { width: 100%; max-width: 420px; background: #fff; border-radius: 14px; box-shadow: 0 20px 50px rgba(0, 0, 0, .25); overflow: hidden; }
.login-head { padding: 26px 28px 18px; border-bottom: 1px solid var(--border); text-align: center; }
.login-logo { width: 56px; height: 56px; margin: 0 auto 10px; border-radius: 14px; background: var(--navy); color: #fff; display: flex; align-items: center; justify-content: center; }
.login-logo svg { width: 30px; height: 30px; }
.login-school { font-size: 1.25rem; font-weight: 700; color: var(--navy-900); }
.login-app { color: var(--muted); font-size: .95rem; }
.login-body { padding: 22px 28px 26px; display: flex; flex-direction: column; gap: 14px; }
.login-foot { padding: 12px 28px; background: #F7F9FC; color: var(--muted); font-size: .8rem; text-align: center; }

/* ---------- โครงหน้าแอป ---------- */
.shell { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; background: var(--navy); color: #DCE6F2; z-index: 30; }
.brand { display: flex; align-items: center; gap: 12px; padding: 18px 18px 16px; border-bottom: 1px solid rgba(255, 255, 255, .1); }
.brand-logo { width: 40px; height: 40px; border-radius: 10px; background: rgba(255, 255, 255, .12); display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
.brand-logo svg { width: 22px; height: 22px; }
.brand-name { color: #fff; font-weight: 700; line-height: 1.25; }
.brand-sub { font-size: .78rem; color: #A9BBD3; line-height: 1.3; }
.nav { flex: 1; overflow-y: auto; padding: 10px 10px 16px; }
.nav-group { margin-top: 12px; }
.nav-group-label { padding: 4px 10px; font-size: .75rem; font-weight: 600; letter-spacing: .02em; color: #8FA6C4; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; margin: 2px 0; border: 0; border-radius: 8px; background: transparent; color: #DCE6F2; text-align: left; cursor: pointer; font-weight: 500; }
.nav-item svg { width: 20px; height: 20px; flex-shrink: 0; opacity: .9; }
.nav-item:hover { background: rgba(255, 255, 255, .08); color: #fff; }
.nav-item.active { background: #fff; color: var(--navy); font-weight: 700; }
.nav-item.active svg { color: var(--blue); }
.userbox { padding: 12px 14px 16px; border-top: 1px solid rgba(255, 255, 255, .1); }
.userbox-name { color: #fff; font-weight: 600; }
.userbox-role { font-size: .8rem; color: #A9BBD3; margin-bottom: 8px; }
.userbox .btn { border-color: rgba(255, 255, 255, .25); background: transparent; color: #fff; }
.userbox .btn:hover { background: rgba(255, 255, 255, .1); }
.userbox-actions { display: flex; gap: 6px; flex-wrap: wrap; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 20; height: var(--topbar-h); display: flex; align-items: center; gap: 12px; padding: 0 24px; background: rgba(255, 255, 255, .96); border-bottom: 1px solid var(--border); backdrop-filter: blur(4px); }
.topbar-title { font-size: 1.1rem; font-weight: 700; color: var(--navy-900); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .menu-toggle { display: none; }
.year-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: var(--blue-50); color: var(--blue-700); font-size: .85rem; font-weight: 600; white-space: nowrap; }
.content { width: 100%; max-width: 1180px; padding: 24px; }
.backdrop { display: none; }

/* ---------- การ์ด / ส่วนหัวหน้า ---------- */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head p { margin: 4px 0 0; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); scroll-margin-top: calc(var(--topbar-h) + 16px); }
.card + .card { margin-top: 16px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.card-body { padding: 18px; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 18px; }
.grid-cards > .card { margin-top: 0; }
.stat { padding: 16px 18px; }
.stat-label { color: var(--muted); font-size: .9rem; }
.stat-value { font-size: 1.6rem; font-weight: 700; color: var(--navy-900); line-height: 1.2; margin-top: 4px; }
.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.steps li { display: flex; gap: 12px; align-items: flex-start; }
.step-no { width: 28px; height: 28px; border-radius: 50%; background: var(--navy); color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; }
.toolbar .field { min-width: 160px; flex: 1; }
.toolbar .grow { flex: 2; }

/* ---------- ตาราง ---------- */
.table-wrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.data-table { width: 100%; border-collapse: collapse; background: #fff; }
.data-table th { text-align: left; font-size: .85rem; font-weight: 600; color: var(--muted); background: #F7F9FC; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.data-table td { padding: 10px 12px; border-bottom: 1px solid #EDF1F6; vertical-align: top; }
.data-table tbody tr:hover { background: #FAFCFE; }
.data-table tr.clickable { cursor: pointer; }
.data-table .actions { white-space: nowrap; text-align: right; }
.data-table .actions .btn + .btn { margin-left: 6px; }
.cell-stack { min-width: 0; }
.clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 220px; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; flex-wrap: wrap; }

/* ---------- หน้าต่าง (modal) ---------- */
.modal-overlay { position: fixed; inset: 0; z-index: 60; background: rgba(18, 37, 64, .5); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px 16px; overflow-y: auto; }
.modal { width: 100%; max-width: 560px; background: #fff; border-radius: 12px; box-shadow: 0 24px 60px rgba(0, 0, 0, .3); }
.modal-lg { max-width: 820px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.modal-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); background: #F9FBFD; border-radius: 0 0 12px 12px; flex-wrap: wrap; }
.icon-btn { width: 36px; height: 36px; border: 0; background: transparent; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
.icon-btn:hover { background: var(--blue-50); color: var(--navy); }
.icon-btn svg { width: 20px; height: 20px; }
.kv { width: 100%; border-collapse: collapse; font-size: .9rem; }
.kv th, .kv td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #EDF1F6; vertical-align: top; word-break: break-word; }
.kv th { color: var(--muted); font-weight: 600; width: 34%; }

/* ---------- การเงิน ---------- */
.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.data-table th.num { text-align: right; }
.strong { font-weight: 700; color: var(--navy-900); }
.text-danger { color: var(--danger); }
.text-success { color: var(--success); }
.field-label { font-weight: 600; margin-bottom: 4px; }
.check-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px 14px; padding: 6px 0; }
.check-grid label { display: flex; align-items: center; gap: 8px; font-weight: 400; cursor: pointer; }
.check-grid input { width: 18px; height: 18px; }
.stat-sub { color: var(--muted); font-size: .85rem; margin-top: 2px; }
.stat-danger .stat-value { color: var(--danger); }
.stack > .card + .card { margin-top: 0; }
.card.clickable { cursor: pointer; }
.card.clickable:hover { border-color: var(--blue); }
.stat-success .stat-value { color: var(--success); }
.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 18px; }
.banner .big { font-size: 1.35rem; font-weight: 700; color: var(--navy-900); }
.banner .muted { margin-top: 2px; }
.receipt-preview { border: 1px dashed #B9C6D6; border-radius: var(--radius-sm); padding: 12px 14px; background: #FBFCFE; }
.receipt-preview h3 { margin: 0 0 8px; font-size: 1rem; }
.receipt-line { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
.receipt-total { display: flex; justify-content: space-between; gap: 12px; font-weight: 700; border-top: 1px solid var(--border); margin-top: 6px; padding-top: 8px; }
.alloc-input { max-width: 150px; text-align: right; }
.amount-input { font-size: 1.25rem; font-weight: 700; }
.sum-line { padding: 8px 12px; border-radius: var(--radius-sm); background: var(--blue-50); }
.sum-line.bad { background: var(--danger-bg); color: #8E2A1F; }
.sum-line.good { background: var(--success-bg); color: #155F3D; }
.confirm-box { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 1px solid #F2DDB4; background: var(--warning-bg); border-radius: var(--radius-sm); cursor: pointer; line-height: 1.5; }
.confirm-box input { width: 20px; height: 20px; margin-top: 2px; flex-shrink: 0; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tabs .btn[aria-pressed="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }
.section-title { margin: 0; font-size: 1.05rem; }
.inline-list { margin: 0; padding-left: 18px; }

/* ---------- ตารางเลขที่ใบเสร็จ ---------- */
.number-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 6px; }
.num-cell { min-height: 40px; padding: 4px; border-radius: 6px; border: 1px solid var(--border); background: #fff; color: var(--muted);
  font: inherit; font-size: .9rem; font-variant-numeric: tabular-nums; cursor: pointer; }
.num-cell:hover, .num-cell:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
.num-cell.num-USED, .badge.badge-num-USED { background: var(--blue-50); border-color: #C8DFF7; color: var(--blue-700); font-weight: 600; }
.num-cell.num-CANCELLED, .badge.badge-num-CANCELLED { background: var(--danger-bg); border-color: #F2C9C4; color: var(--danger); }
.num-cell.num-CANCELLED { text-decoration: line-through; }
.num-cell.num-CANCEL_PENDING, .badge.badge-num-CANCEL_PENDING { background: var(--warning-bg); border-color: #F2DDB4; color: var(--warning); }
.num-cell.num-GAP { border: 2px dashed var(--danger); color: var(--danger); font-weight: 700; }
.badge.badge-num-GAP { background: #fff; border: 1px dashed var(--danger); color: var(--danger); }
.badge.badge-num-UNUSED { background: #fff; border: 1px solid var(--border); color: var(--muted); }
.num-cell.num-CLOSED_UNUSED, .badge.badge-num-CLOSED_UNUSED { background: #EEF1F5; color: #8A97A8; }
.num-cell.num-corrected { box-shadow: inset 0 -3px 0 var(--warning); }

/* ---------- พิมพ์รายงาน ---------- */
.print-only { display: none; }
.print-head { margin-bottom: 12px; line-height: 1.5; }
.print-head h1 { font-size: 16pt; margin: 4px 0; }

/* ---------- เอกสารและรายงานแบบทางการ (ระยะที่ 7) ----------
   หน้าจอ: แสดงเป็นแผ่นกระดาษ A4 / พิมพ์: เหลือเฉพาะเนื้อเอกสาร (เมนูและปุ่มถูกซ่อน) */
.report-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.report-item { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); cursor: pointer; font: inherit; color: inherit; }
.report-item:hover, .report-item:focus-visible { border-color: var(--blue); outline: none; }
.report-item svg { width: 22px; height: 22px; flex-shrink: 0; color: var(--blue); margin-top: 2px; }
.report-item .ri-title { font-weight: 700; display: block; }
.report-item .ri-desc { color: var(--muted); font-size: .9em; display: block; margin-top: 2px; }
.doc { background: #fff; color: #111; max-width: 210mm; margin: 0 auto 20px; padding: 12mm 13mm 10mm; border: 1px solid var(--border); border-radius: 4px; box-shadow: var(--shadow); font-size: 15px; line-height: 1.55; }
.doc-head { text-align: center; margin-bottom: 12px; }
.doc .strong { color: inherit; }
.doc-school { font-weight: 700; }
.doc-title { font-size: 1.2em; font-weight: 700; margin: 2px 0; }
.doc-sub { color: #222; }
.doc-draft { display: inline-block; margin-top: 6px; padding: 0 10px; border: 1.5px solid var(--danger); border-radius: 4px; color: var(--danger); font-weight: 700; }
.doc-section { font-weight: 700; margin: 14px 0 6px; }
.doc-scroll { overflow-x: auto; }
.doc-table { width: 100%; border-collapse: collapse; font-size: .92em; }
.doc-table th, .doc-table td { border: 1px solid #666; padding: 3px 6px; vertical-align: top; }
.doc-table th { background: #EEF1F5; font-weight: 700; text-align: center; }
.doc-table .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.doc-table .center { text-align: center; }
.doc-table .nowrap { white-space: nowrap; }
.doc-table tr.total td { font-weight: 700; background: #F6F7F9; }
.doc-table tr.sub td { font-weight: 700; }
.doc-table tr.void td { color: #666; }
.doc-table tr.void .amt { text-decoration: line-through; }
.doc-table tr.indent td:first-child { padding-left: 18px; }
.doc-lines { margin: 8px 0; }
.doc-lines div { margin: 2px 0; }
.doc-note { font-size: .85em; color: #333; margin-top: 8px; }
.doc-signs { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 22px 24px; margin-top: 26px; break-inside: avoid; }
.doc-sign { text-align: center; line-height: 1.9; }
.doc-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 16px; margin-top: 18px; padding-top: 6px; border-top: 1px solid #999; font-size: .78em; color: #333; }
.doc-letter { font-size: 16px; }
.doc-letter .letter-head { text-align: center; margin-bottom: 14px; }
.doc-letter .letter-date { text-align: right; margin: 6px 0 10px; }
.doc-letter .letter-meta { display: grid; grid-template-columns: 4em minmax(0, 1fr); gap: 2px 8px; margin-bottom: 10px; }
