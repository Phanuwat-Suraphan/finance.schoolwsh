<script>
/* ==========================================================================
   JsViews — หน้าจอของระบบ (ระยะที่ 2)
   เข้าสู่ระบบ / เปลี่ยนรหัสผ่าน / หน้าหลัก / ผู้ใช้งาน / ตั้งค่าโรงเรียน / ปีการศึกษา / ประวัติการใช้งาน
   ========================================================================== */
(function () {
  'use strict';
  var h = App.h;
  var clear = App.clear;
  var icon = App.icon;
  var ALL = ['ADMIN', 'FINANCE', 'DIRECTOR'];

  App.MENU_GROUPS = [
    { key: 'main', label: 'ทั่วไป' },
    { key: 'finance', label: 'การเงิน' },
    { key: 'students', label: 'ข้อมูลนักเรียน' },
    { key: 'manage', label: 'การจัดการระบบ' },
    { key: 'info', label: 'ข้อมูลโรงเรียน' },
  ];

  var PASSWORD_RULES = [
    'อย่างน้อย 8 ตัวอักษร',
    'มีทั้งตัวอักษรและตัวเลข',
    'ไม่มีชื่อผู้ใช้อยู่ในรหัสผ่าน',
  ];

  function rulesList(extra) {
    return h('ul', { class: 'rules' }, PASSWORD_RULES.concat(extra || []).map(function (r) { return h('li', { text: r }); }));
  }

  function pageHead(title, description, actions) {
    return h('div', { class: 'page-head' },
      h('div', null, h('h1', { text: title }), description ? h('p', { text: description }) : null),
      actions ? h('div', { class: 'toolbar', style: { marginBottom: '0' } }, actions) : null);
  }

  function button(label, kind, onClick, iconName) {
    var btn = h('button', { type: 'button', class: 'btn' + (kind ? ' btn-' + kind : '') }, iconName ? icon(iconName) : null, label);
    btn.addEventListener('click', onClick);
    return btn;
  }

  // ---------------------------------------------------------------------------
  // หน้าเข้าสู่ระบบ
  // ---------------------------------------------------------------------------
  function authPage(title, subtitle, bodyNodes) {
    var app = clear(document.getElementById('app'));
    app.appendChild(h('div', { class: 'login-page' },
      h('div', { class: 'login-card' },
        h('div', { class: 'login-head' },
          h('div', { class: 'login-logo' }, icon('school')),
          h('div', { class: 'login-school', text: title }),
          h('div', { class: 'login-app', text: subtitle })),
        h('div', { class: 'login-body' }, bodyNodes),
        h('div', { class: 'login-foot', text: 'จังหวัด' + BOOT.province + ' · เวอร์ชัน ' + BOOT.version }))));
  }

  App.showLogin = function (message, kind) {
    App.state.me = null;
    App.state.studentYear = null;
    App.state.studentFilters = { grade: '', room: '', status: 'STUDYING', q: '' };
    App.clearOverlays();
    var notice = h('div', { class: 'alert ' + (kind === 'info' ? 'alert-info' : 'alert-error') + (message ? '' : ' hidden'), role: 'alert', text: message || '' });
    function showError(text) {
      notice.className = 'alert alert-error';
      notice.textContent = text;
    }
    function onLoggedIn(result) {
      App.session.set(result.token, result.remember === true);
      return App.loadMe();
    }
    var stayIn = BOOT.allowRemember ? App.field({
      label: 'อยู่ในระบบต่อในเครื่องนี้ (ปิดเบราว์เซอร์แล้วไม่ต้องเข้าสู่ระบบใหม่)', type: 'checkbox',
      help: 'เลือกเฉพาะเครื่องส่วนตัว ห้ามเลือกในเครื่องที่ใช้ร่วมกัน ระบบยังออกจากระบบเองเมื่อครบอายุการเข้าสู่ระบบที่ผู้ดูแลระบบกำหนด',
    }) : null;

    if (BOOT.authMode === 'GOOGLE') {
      var googleBtn = h('button', { type: 'button', class: 'btn btn-block', text: 'เข้าสู่ระบบด้วยบัญชี Google ของโรงเรียน' });
      googleBtn.addEventListener('click', function () {
        googleBtn.disabled = true;
        App.api('auth.loginGoogle', { remember: stayIn ? stayIn.get() : false }).then(onLoggedIn).catch(function (err) {
          googleBtn.disabled = false;
          showError(err.message);
        });
      });
      authPage(BOOT.schoolName, BOOT.appName, [notice,
        h('p', { class: 'muted small', text: 'ระบบจะใช้บัญชี Google ที่เข้าสู่ระบบอยู่ในเบราว์เซอร์นี้' }), stayIn ? stayIn.wrap : null, googleBtn]);
      return;
    }

    var savedName = App.session.rememberedUsername();
    var username = App.field({ label: 'ชื่อผู้ใช้', autocomplete: 'username', autocapitalize: 'none', mono: true, value: savedName });
    var password = App.passwordField({ label: 'รหัสผ่าน', autocomplete: 'current-password' });
    var keepName = App.field({ label: 'จดจำชื่อผู้ใช้ในเครื่องนี้', type: 'checkbox', value: true });
    var submit = h('button', { type: 'submit', class: 'btn btn-block', text: 'เข้าสู่ระบบ' });
    var form = h('form', { class: 'stack', novalidate: true }, notice, username.wrap, password.wrap,
      h('div', { class: 'login-options' }, keepName.wrap, stayIn ? stayIn.wrap : null), submit);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (submit.disabled) return;
      submit.disabled = true;
      submit.textContent = 'กำลังตรวจสอบ…';
      notice.classList.add('hidden');
      var name = username.input.value.trim();
      App.api('auth.login', { username: name, password: password.input.value, remember: stayIn ? stayIn.get() : false })
        .then(function (result) {
          App.session.rememberUsername(name.toLowerCase(), keepName.get());
          return onLoggedIn(result);
        })
        .catch(function (err) {
          password.input.value = '';
          showError(err.message);
          password.input.focus();
        })
        .then(function () {
          submit.disabled = false;
          submit.textContent = 'เข้าสู่ระบบ';
        });
    });
    authPage(BOOT.schoolName, BOOT.appName, [form,
      h('p', { class: 'muted small', text: 'ลืมรหัสผ่าน กรุณาติดต่อผู้ดูแลระบบของโรงเรียน' })]);
    (savedName ? password.input : username.input).focus();
  };

  // ---------------------------------------------------------------------------
  // เปลี่ยนรหัสผ่าน (บังคับเมื่อใช้รหัสผ่านชั่วคราว / เลือกเองจากเมนู)
  // ---------------------------------------------------------------------------
  function changePasswordRequest(values) {
    if (values.newPassword !== values.confirmPassword) {
      return Promise.reject({ message: 'รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน' });
    }
    return App.api('auth.changePassword', { currentPassword: values.currentPassword, newPassword: values.newPassword })
      .then(function (result) {
        App.session.set(result.token);
        return result;
      });
  }

  App.showForcedPasswordChange = function () {
    var me = App.state.me;
    var notice = h('div', { class: 'alert alert-error hidden', role: 'alert' });
    var current = App.passwordField({ label: 'รหัสผ่านปัจจุบัน (รหัสผ่านชั่วคราว)', autocomplete: 'current-password' });
    var next = App.passwordField({ label: 'รหัสผ่านใหม่', autocomplete: 'new-password' });
    var confirm = App.passwordField({ label: 'ยืนยันรหัสผ่านใหม่', autocomplete: 'new-password' });
    var submit = h('button', { type: 'submit', class: 'btn btn-block', text: 'บันทึกรหัสผ่านใหม่' });
    var logout = h('button', { type: 'button', class: 'btn btn-ghost btn-block', text: 'ออกจากระบบ' });
    logout.addEventListener('click', function () { App.logout(); });
    var form = h('form', { class: 'stack', novalidate: true },
      h('div', { class: 'alert alert-info' },
        h('strong', { text: 'กรุณาตั้งรหัสผ่านใหม่ก่อนใช้งาน' }),
        h('div', { text: 'บัญชีนี้ใช้รหัสผ่านชั่วคราวที่ผู้ดูแลระบบกำหนด รหัสผ่านใหม่ต้อง:' }),
        rulesList(['ไม่ซ้ำกับรหัสผ่านเดิม'])),
      notice, current.wrap, next.wrap, confirm.wrap, submit, logout);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (submit.disabled) return;
      submit.disabled = true;
      notice.classList.add('hidden');
      changePasswordRequest({ currentPassword: current.input.value, newPassword: next.input.value, confirmPassword: confirm.input.value })
        .then(function () {
          App.toast('เปลี่ยนรหัสผ่านเรียบร้อยแล้ว', 'success');
          return App.loadMe();
        })
        .catch(function (err) {
          if (err && err.handled) return;
          notice.textContent = err.message;
          notice.classList.remove('hidden');
        })
        .then(function () { submit.disabled = false; });
    });
    authPage('ตั้งรหัสผ่านใหม่', (me ? me.user.displayName + ' · ' : '') + BOOT.schoolName, form);
    current.input.focus();
  };

  App.openChangePassword = function () {
    App.formModal({
      title: 'เปลี่ยนรหัสผ่าน',
      intro: h('div', { class: 'alert alert-info' }, h('div', { text: 'รหัสผ่านใหม่ต้อง:' }), rulesList(['ไม่ซ้ำกับรหัสผ่านเดิม']),
        h('div', { class: 'small', text: 'หลังเปลี่ยน การเข้าสู่ระบบบนเครื่องอื่นของคุณจะหมดอายุทันที' })),
      fields: [
        { key: 'currentPassword', label: 'รหัสผ่านปัจจุบัน', type: 'password', autocomplete: 'current-password', span2: true },
        { key: 'newPassword', label: 'รหัสผ่านใหม่', type: 'password', autocomplete: 'new-password' },
        { key: 'confirmPassword', label: 'ยืนยันรหัสผ่านใหม่', type: 'password', autocomplete: 'new-password' },
      ],
      submitLabel: 'เปลี่ยนรหัสผ่าน',
      onSubmit: changePasswordRequest,
      onDone: function () { App.toast('เปลี่ยนรหัสผ่านเรียบร้อยแล้ว', 'success'); },
    });
  };

  // ---------------------------------------------------------------------------
  // หน้าหลัก
  // ---------------------------------------------------------------------------
  function stat(label, value) {
    return h('div', { class: 'card stat' }, h('div', { class: 'stat-label', text: label }), h('div', { class: 'stat-value', text: value }));
  }

  function stepList(steps) {
    return h('ol', { class: 'steps' }, steps.map(function (s, i) {
      return h('li', null, h('span', { class: 'step-no', text: String(i + 1) }),
        h('div', { style: { flex: '1' } }, h('div', { text: s.text }), s.help ? h('div', { class: 'muted small', text: s.help }) : null),
        s.route ? button(s.button || 'ไปที่หน้านี้', 'secondary btn-sm', function () { App.go(s.route); }) : null);
    }));
  }

  function integrityAlert(last) {
    return h('div', { class: 'alert alert-error' },
      h('span', { text: 'การตรวจความถูกต้องของข้อมูลเมื่อ ' + App.fmt.datetime(last.at) + ' พบปัญหา ' + last.problemCount + ' จุด ' }),
      App.button('ดูรายละเอียด', 'ghost btn-sm', function () { App.go('integrity'); }));
  }

  function daysSince(fromIso, toIso) {
    var a = fromIso.split('-').map(Number);
    var b = toIso.split('-').map(Number);
    return Math.round((Date.UTC(b[0], b[1] - 1, b[2]) - Date.UTC(a[0], a[1] - 1, a[2])) / 86400000);
  }

  App.defineRoute('home', {
    title: 'หน้าหลัก',
    roles: ALL,
    menu: { group: 'main', label: 'หน้าหลัก', icon: 'home' },
    render: function () {
      var me = App.state.me;
      var role = me.user.role;
      var card;
      if (role === 'ADMIN') {
        card = h('div', { class: 'card' },
          h('div', { class: 'card-head' }, h('h2', { text: 'เริ่มต้นใช้งาน (ผู้ดูแลระบบ)' })),
          h('div', { class: 'card-body' }, stepList([
            { text: 'ตรวจและกรอกข้อมูลโรงเรียน และชื่อผู้ลงนามในเอกสาร', route: 'settings' },
            { text: 'เพิ่มผู้ใช้: เจ้าหน้าที่การเงิน และผู้อำนวยการ', help: 'กำหนดรหัสผ่านชั่วคราว แล้วแจ้งผู้ใช้เป็นการส่วนตัว ผู้ใช้ต้องเปลี่ยนรหัสผ่านเมื่อเข้าสู่ระบบครั้งแรก', route: 'users' },
            { text: 'ตรวจปีการศึกษาปัจจุบัน', route: 'years' },
            { text: 'ดูประวัติการใช้งาน และตรวจความถูกต้องของประวัติ', route: 'audit' },
            { text: 'สำรองข้อมูล และตรวจว่าเปิดการสำรองอัตโนมัติรายวันไว้แล้ว', help: 'ไฟล์สำรองอยู่ใน Google Drive ของบัญชีเจ้าของระบบ กู้คืนได้จากหน้านี้', route: 'backups', button: 'สำรองข้อมูล' },
            { text: 'ตรวจความถูกต้องของข้อมูลทั้งระบบ (ระบบตรวจให้อัตโนมัติทุกวันด้วย)', route: 'integrity', button: 'ตรวจความถูกต้อง' },
          ])));
      } else if (role === 'DIRECTOR') {
        card = h('div', { class: 'card' },
          h('div', { class: 'card-head' }, h('h2', { text: 'งานของผู้อำนวยการ' })),
          h('div', { class: 'card-body' }, stepList([
            { text: 'ดูภาพรวมการเงินของปีการศึกษา: ยอดเรียกเก็บ ยอดรับ ยอดค้าง และความคืบหน้ารายชั้น', route: 'dashboard', button: 'ภาพรวม' },
            { text: 'พิจารณาคำขอลดหย่อน ยกเว้น และยกเลิกรายการเรียกเก็บ', help: 'ตรวจเหตุผลและเอกสารอ้างอิงก่อนอนุมัติ', route: 'approvals', button: 'คำขออนุมัติ' },
            { text: 'ตรวจและลงนามรายงานรับเงินประจำวัน เปิดยอดใหม่เมื่อจำเป็นต้องแก้ไข', route: 'report-daily', button: 'รายงานประจำวัน' },
            { text: 'ดูรายการรับเงินประจำวันและยอดรวมแยกช่องทาง', route: 'payment-history', button: 'รายการรับเงิน' },
            { text: 'ดูอัตราเงินบำรุง ยอดเรียกเก็บ และยอดค้างของแต่ละชั้น', route: 'fees' },
            { text: 'ดูทะเบียนเล่มใบเสร็จ และเลขที่ที่ใช้ไป', route: 'receipt-books' },
            { text: 'ดูประวัติการใช้งานของทุกบัญชี และตรวจว่าประวัติไม่ถูกแก้ไข', route: 'audit' },
            { text: 'ตรวจความถูกต้องของข้อมูลทั้งระบบ: ยอดเงิน เลขที่ใบเสร็จ และวันที่ปิดยอดแล้ว', route: 'integrity', button: 'ตรวจความถูกต้อง' },
          ])));
      } else {
        card = h('div', { class: 'card' },
          h('div', { class: 'card-head' }, h('h2', { text: 'งานของเจ้าหน้าที่การเงิน' })),
          h('div', { class: 'card-body' }, stepList([
            { text: 'นำเข้ารายชื่อนักเรียนจาก Excel หรือ CSV แล้วตรวจรายชื่อแยกตามชั้นและห้อง', route: 'students', button: 'ข้อมูลนักเรียน' },
            { text: 'ตั้งอัตราเงินบำรุงพร้อมเอกสารที่อนุมัติ แล้วสร้างรายการเรียกเก็บ', route: 'fees', button: 'อัตราและการเรียกเก็บ' },
            { text: 'ลงทะเบียนและเปิดใช้เล่มใบเสร็จรับเงินจากเล่มจริง', route: 'receipt-books', button: 'เล่มใบเสร็จ' },
            { text: 'รับชำระเงิน: เขียนใบเสร็จจริง แล้วบันทึกเลขเล่ม เลขที่ และจำนวนเงิน', route: 'payments', button: 'รับชำระเงิน' },
            { text: 'ยื่นคำขอลดหย่อน ยกเว้น หรือยกเลิกรายการเรียกเก็บ และติดตามผล', route: 'approvals', button: 'คำขออนุมัติ' },
            { text: 'สิ้นวัน: พิมพ์รายงานรับเงินประจำวัน ตรวจกับเงินและสำเนาใบเสร็จ ให้ผู้เกี่ยวข้องลงนาม แล้วกดปิดยอด', route: 'report-daily', button: 'ปิดยอดประจำวัน' },
            { text: 'พิมพ์เอกสารแจ้งยอดถึงผู้ปกครอง และรายงานอื่น ๆ', route: 'reports', button: 'รายงาน' },
          ])));
      }
      var stats = [
        stat('ปีการศึกษาปัจจุบัน', String(me.school.currentAcademicYear)),
        stat('บทบาทของคุณ', me.user.roleLabel),
        stat('สถานะการพัฒนาระบบ', (/ระยะที่ \d+/.exec(BOOT.release) || ['ระยะที่ ?'])[0] + ' จาก 8'),
      ];
      var page = function (extra) {
        return h('div', null,
          pageHead('สวัสดี คุณ' + me.user.displayName, me.school.name + ' · ' + me.user.roleLabel),
          h('div', { class: 'grid-cards' }, (extra ? [extra] : []).concat(stats)),
          card);
      };
      if (role === 'ADMIN') {
        return Promise.all([App.api('backups.status', {}), App.api('integrity.status', {})]).then(function (res) {
          var b = res[0];
          var integrity = res[1].last;
          var last = b.last;
          var stale = !last || daysSince(last.createdAt.slice(0, 10), b.today) > 2;
          var box = App.statCard('สำรองข้อมูลล่าสุด', last ? App.fmt.datetime(last.createdAt) : 'ยังไม่เคยสำรอง',
            b.schedule.enabled ? 'สำรองอัตโนมัติทุกวัน ' + b.schedule.hourLabel : 'ยังไม่เปิดการสำรองอัตโนมัติ', stale || !b.schedule.enabled ? 'danger' : 'success');
          box.classList.add('clickable');
          box.addEventListener('click', function () { App.go('backups'); });
          var node = page(box);
          var alerts = [];
          if (!b.schedule.enabled) alerts.push(h('div', { class: 'alert alert-warning', text: 'ยังไม่ได้เปิดการสำรองข้อมูลอัตโนมัติ กรุณาเปิดในหน้า "สำรองและกู้คืนข้อมูล"' }));
          if (integrity && !integrity.ok) alerts.push(integrityAlert(integrity));
          if (b.lastAuto && !b.lastAuto.ok) alerts.push(h('div', { class: 'alert alert-error', text: 'การสำรองข้อมูลอัตโนมัติครั้งล่าสุดไม่สำเร็จ กรุณาตรวจในหน้า "สำรองและกู้คืนข้อมูล"' }));
          else if (b.schedule.enabled && stale) alerts.push(h('div', { class: 'alert alert-warning', text: 'ไม่มีการสำรองข้อมูลมากกว่า 2 วัน กรุณาตรวจการสำรองอัตโนมัติ' }));
          if (alerts.length) node.insertBefore(h('div', { class: 'stack', style: { marginBottom: '16px' } }, alerts), node.children[1]);
          return node;
        }, function () { return page(null); });
      }
      // คำขอที่รออนุมัติ และสิ่งที่ต้องตรวจในทะเบียนคุมใบเสร็จ
      return Promise.all([App.api('approvals.list'), App.api('receipts.books'), App.api('arrears.summary'), App.api('closings.list', {}),
        role === 'DIRECTOR' ? App.api('integrity.status', {}) : Promise.resolve(null)]).then(function (res) {

  // ตั้งค่าโรงเรียน (ทุกบทบาทดูได้ แก้ไขได้เฉพาะผู้ดูแลระบบ)
  // ---------------------------------------------------------------------------
  function settingInput(item, editable) {
    var disabled = !editable || item.readOnly;
    var help = item.description || '';
    if ((item.type === 'int') && item.min !== null) help = (help ? help + ' ' : '') + '(' + item.min + '–' + item.max + ')';
    if (item.type === 'bool') return App.field({ type: 'checkbox', label: item.label, value: item.value, help: help, disabled: disabled, span2: true });
    if (item.type === 'list') return App.field({ type: 'textarea', label: item.label, value: item.value.join(', '), help: help, disabled: disabled, span2: true, rows: 2, maxlength: 1500 });
    if (item.type === 'int' || item.type === 'year') return App.field({ type: 'number', label: item.label, value: item.value, min: item.min, max: item.max, help: help, disabled: disabled, inputmode: 'numeric' });
    return App.field({ label: item.label, value: item.value, help: help, disabled: disabled, maxlength: 300, span2: item.key === 'SCHOOL_ADDRESS' || item.key === 'SCHOOL_AFFILIATION' });
  }

  function settingCurrentValue(item, f) {
    if (item.type === 'bool') return f.input.checked;
    if (item.type === 'list') return f.input.value.split(',').map(function (s) { return s.trim(); }).filter(Boolean).join(',');
    return String(f.input.value).trim();
  }

  function settingOriginalValue(item) {
    if (item.type === 'bool') return item.value;
    if (item.type === 'list') return item.value.join(',');
    return String(item.value === null || item.value === undefined ? '' : item.value);
  }

          footer = h('div', { class: 'card card-body', style: { position: 'sticky', bottom: '12px', marginTop: '16px', display: 'flex', justifyContent: 'flex-end', gap: '10px', alignItems: 'center', flexWrap: 'wrap' } },

  var ACTION_KIND = {
    LOGIN_FAILED: 'danger', ACCESS_DENIED: 'danger', CANCEL: 'danger', REJECT: 'danger',
    CREATE: 'success', APPROVE: 'success', IMPORT: 'success',
    UPDATE: 'warning', PASSWORD_CHANGE: 'warning', RESTORE: 'warning',
    LOGIN: 'muted', LOGOUT: 'muted', INTEGRITY_CHECK: 'muted', SETUP: 'muted',
  };

  function kvTable(obj) {
    if (!obj || typeof obj !== 'object') return h('p', { class: 'muted', text: 'ไม่มีข้อมูล' });
    var keys = Object.keys(obj);
    if (!keys.length) return h('p', { class: 'muted', text: 'ไม่มีข้อมูล' });
    return h('table', { class: 'kv' }, h('tbody', null, keys.map(function (k) {
      var v = obj[k];
      var text = v === null || v === undefined || v === '' ? '–' : (typeof v === 'object' ? JSON.stringify(v) : String(v));
      return h('tr', null, h('th', { text: k }), h('td', { text: text }));
    })));
  }

  function openAuditDetail(item) {
    var info = {
      'วันเวลา': formatThaiDateTime_(item.timestamp),
      'ผู้ใช้': item.username,
      'บทบาท': item.roleLabel,
      'การกระทำ': item.actionLabel,
      'รายการ': item.entityLabel,
      'รหัสรายการ': item.entityId,
      'หมายเหตุ': item.note,
      'รหัสประวัติ': item.logId,
    };
    App.modal({
      title: 'รายละเอียดประวัติ',
      size: 'lg',
      body: [kvTable(info),
        item.before ? [h('h3', { text: 'ค่าเดิม' }), kvTable(item.before)] : null,
        item.after ? [h('h3', { text: 'ค่าใหม่' }), kvTable(item.after)] : null],
      actions: [{ label: 'ปิด', kind: 'secondary' }],
    });
  }

  function openVerifyResult(result) {
    var body;
    if (result.ok) {
      body = h('div', { class: 'alert alert-success', text: 'ถูกต้อง: ประวัติการใช้งาน ' + result.total + ' รายการ ต่อเนื่องครบถ้วน ไม่พบการแก้ไขหรือลบ' });
    } else {
      body = [
        h('div', { class: 'alert alert-error', text: 'พบปัญหา ' + result.problemCount + ' จุด จากประวัติทั้งหมด ' + result.total + ' รายการ' }),
        App.table({ rows: result.problems, columns: [
          { label: 'แถวในชีต', key: 'rowNumber' },
          { label: 'รหัสประวัติ', render: function (p) { return h('span', { class: 'mono', text: p.logId || '–' }); } },
          { label: 'ปัญหา', key: 'label' },
        ] }),
        h('p', { class: 'muted small', text: 'กรุณาตรวจสอบประวัติเวอร์ชันของไฟล์ Google Sheets (ไฟล์ > ประวัติเวอร์ชัน) และรายงานผู้อำนวยการ' }),
      ];
    }
    App.modal({ title: 'ผลการตรวจความถูกต้องของประวัติ', size: 'lg', body: body, actions: [{ label: 'ปิด', kind: 'secondary' }] });
  }

  App.defineRoute('audit', {
    title: 'ประวัติการใช้งาน',
    roles: ['ADMIN', 'DIRECTOR'],
    menu: { group: 'manage', label: 'ประวัติการใช้งาน', icon: 'history' },
    render: function () {
      var filters = { action: '', username: '', dateFrom: '', dateTo: '', q: '', page: 1 };
      return App.api('audit.list', filters).then(function (first) {
        var action = App.field({ label: 'การกระทำ', type: 'select', options: [{ value: '', label: 'ทั้งหมด' }].concat(first.actions) });
        var username = App.field({ label: 'ชื่อผู้ใช้', autocapitalize: 'none', mono: true });
        var dateFrom = App.field({ label: 'ตั้งแต่วันที่', type: 'date' });
        var dateTo = App.field({ label: 'ถึงวันที่', type: 'date' });
        var q = App.field({ label: 'คำค้น', placeholder: 'รหัสรายการ หรือหมายเหตุ' });
        var results = h('div');

        function draw(data) {
          var pager = h('div', { class: 'pager' },
            h('span', { class: 'muted small', text: 'ทั้งหมด ' + data.total.toLocaleString('th-TH') + ' รายการ · หน้า ' + data.page + ' จาก ' + data.pages }),
            h('div', { class: 'toolbar', style: { marginBottom: '0' } },
              button('ก่อนหน้า', 'secondary btn-sm', function () { load(data.page - 1); }),
              button('ถัดไป', 'secondary btn-sm', function () { load(data.page + 1); })));
          pager.querySelectorAll('button')[0].disabled = data.page <= 1;
          pager.querySelectorAll('button')[1].disabled = data.page >= data.pages;
          clear(results).appendChild(App.table({
            rows: data.items,
            empty: 'ไม่พบประวัติตามเงื่อนไข',
            onRowClick: openAuditDetail,
            columns: [
              { label: 'วันเวลา', className: 'nowrap', render: function (r) { return App.fmt.datetime(r.timestamp); } },
              { label: 'ผู้ใช้', render: function (r) { return h('div', null, h('div', { class: 'mono', text: r.username }), h('div', { class: 'muted small', text: r.roleLabel })); } },
              { label: 'การกระทำ', render: function (r) { return App.badge(r.actionLabel, ACTION_KIND[r.action] || ''); } },
              { label: 'รายการ', render: function (r) { return h('div', null, h('div', { text: r.entityLabel }), r.entityId ? h('div', { class: 'muted small mono', text: r.entityId }) : null); } },
              { label: 'หมายเหตุ', key: 'note' },
            ],
          }));
          results.appendChild(pager);
        }

        function load(page) {
          filters = { action: action.get(), username: username.get(), dateFrom: dateFrom.get(), dateTo: dateTo.get(), q: q.get(), page: page || 1 };
          return App.api('audit.list', filters).then(draw).catch(App.fail);
        }

        var searchBtn = button('ค้นหา', '', function () { load(1); }, 'search');
        var resetBtn = button('ล้างเงื่อนไข', 'secondary', function () {
          [username, dateFrom, dateTo, q].forEach(function (f) { f.input.value = ''; f.input.dispatchEvent(new Event('change')); });
          action.input.value = '';
          load(1);
        });
        var verifyBtn = button('ตรวจความถูกต้องของประวัติ', 'secondary', function () {
          verifyBtn.disabled = true;
          App.api('audit.verify')
            .then(function (result) { openVerifyResult(result); return load(filters.page); })
            .catch(App.fail)
            .then(function () { verifyBtn.disabled = false; });
        }, 'shield');
        [username.input, q.input].forEach(function (input) {
          input.addEventListener('keydown', function (e) { if (e.key === 'Enter') load(1); });
        });
        draw(first);
        return h('div', null,
          pageHead('ประวัติการใช้งาน', 'บันทึกทุกการเพิ่ม แก้ไข เข้าสู่ระบบ และการปฏิเสธสิทธิ์ แก้ไขหรือลบไม่ได้ คลิกรายการเพื่อดูค่าเดิมและค่าใหม่', verifyBtn),
          h('div', { class: 'card' }, h('div', { class: 'card-body' },
            h('div', { class: 'toolbar' }, action.wrap, username.wrap, dateFrom.wrap, dateTo.wrap, q.wrap),
            h('div', { class: 'toolbar' }, searchBtn, resetBtn),
            results)));
      });
    },
  });

})();
</script>
